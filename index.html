<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="An unofficial concept redesign of BAUST's Smart Campus student portal, on synthetic sample data. Not affiliated with BAUST." />
    <!-- An unofficial concept that borrows BAUST's name: keep it out of search results so it's never mistaken for the real portal. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smart-campus-baust.web.app/" />
    <meta property="og:title" content="Smart Campus · an unofficial concept redesign" />
    <meta property="og:description" content="BAUST's student portal reimagined as a Bangladesh Railway departure board. Synthetic sample data; not affiliated with BAUST." />
    <meta property="og:image" content="https://smart-campus-baust.web.app/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Smart Campus concept: a flag-green sign-in screen with an amber departure board, marked unofficial concept." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#006A4E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B2C22" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Smart Campus · BAUST</title>
    <script>
      // Apply saved display preferences before first paint so there is no theme flash.
      try {
        var p = JSON.parse(localStorage.getItem("sc.display") || "{}");
        var dark = p.theme === "dark" || (p.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.text = p.text || "m";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
        document.documentElement.dataset.text = "m";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
